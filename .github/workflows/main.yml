name: Build NPM Offline Package # 流水线的名字

on:
  push:
    branches: [ main ] # 当推送到 main 分支时触发
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest # 指定运行环境
    
    steps:
      # 1. 【基础步骤】拉取你自己的仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 【核心步骤】使用 Docker 编译并生成离线包
      - name: Build Docker image and extract package
        run: |
          docker build -t npm-offline-builder .
          docker create --name temp-container npm-offline-builder
          docker cp temp-container:/npm-geoip2-offline.tar.gz .
          docker rm temp-container

      # 3. 【你发的这段代码】将生成好的包上传到 GitHub 供下载
      - name: Upload Offline Package
        uses: actions/upload-artifact@v4
        with:
          name: npm-geoip2-offline-package
          path: ./npm-geoip2-offline.tar.gz
          retention-days: 7
