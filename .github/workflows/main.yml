name: Build and Push NPM with GeoIP2

# 当你向 main 分支推送代码，或者手动触发时，自动运行

on:

  push:

    branches: [ "main" ]

  workflow_dispatch: # 允许手动点击按钮运行

jobs:

  build:

    runs-on: ubuntu-latest # 使用 GitHub 提供的最新 Ubuntu 服务器

    steps:

    # 1. 检出你仓库里的代码（也就是刚刚上传的 Dockerfile）

    - name: Checkout code

      uses: actions/checkout@v4

    # 2. 设置 Docker 构建环境

    - name: Set up Docker Buildx

      uses: docker/setup-buildx-action@v3

    # 3. 登录到你的 Docker Hub 账号（为了把编译好的镜像推送到你的账号下）

    - name: Login to Docker Hub

      uses: docker/login-action@v3

      with:

        username: ${{ secrets.DOCKER_USERNAME }}

        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. 开始编译并自动推送到 Docker Hub

    - name: Build and push

      uses: docker/build-push-action@v5

      with:

        context: . # 使用当前目录（包含 Dockerfile）

        push: true # 编译成功后自动推送

        tags: ${{ secrets.DOCKER_USERNAME }}/my-npm-geoip2:latest # 你的专属镜像名
